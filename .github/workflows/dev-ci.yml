name: Dev CI

on:
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Run unit tests
        shell: cmd
        run: python tests.py

      - name: Run integration tests
        shell: cmd
        run: python integration_tests.py