name: Prerelease to Main CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Run unit tests
        shell: cmd
        run: python tests.py

      - name: Run integration tests
        shell: cmd
        run: python integration-tests.py

      - name: Run calculator
        shell: cmd
        run: python calculator.py

      - name: Automatic regression test
        shell: cmd
        run: python regression-tests.py

      - name: Manual testing required
        shell: cmd
        run: echo Manual testing must be completed before production deployment